name: Portfolio visual check (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check portfolio at required widths
        run: |
          python3 -m http.server 8009 --bind 127.0.0.1 >/tmp/ot-http.log 2>&1 &
          node scripts/visual-check-temp.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-visual-check
          path: visual-check-output/
          retention-days: 7
