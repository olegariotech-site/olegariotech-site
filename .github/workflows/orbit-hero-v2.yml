name: Apply Orbit Hero V2 patch

on:
  push:
    branches:
      - feature/orbit-hero-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[orbit-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/orbit-hero-v2
          fetch-depth: 0

      - name: Apply Orbit hero integration
        run: python .github/scripts/orbit_hero_patch.py

      - name: Validate resulting HTML and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'id="otGlobe"',
              'function orbitHeroCanvas()',
              'window.otOrbitProgress=p;',
              'SINAL COMERCIAL',
              'prefers-reduced-motion'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing required integration markers: {missing}')
          if text.count('id="otGlobe"') != 1:
              raise SystemExit('otGlobe ID is duplicated')
          print('Static Orbit integration checks passed')
          PY
          npx --yes html-validate index.html --rule=no-inline-style:off

      - name: Remove temporary automation files
        run: |
          rm -f .github/scripts/orbit_hero_patch.py
          rm -f .github/workflows/orbit-hero-v2.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit final index-only change
        run: |
          git config user.name "Olegario Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[orbit-patch] feat: integrate lightweight Orbit canvas into hero"
          git push origin HEAD:feature/orbit-hero-v2
