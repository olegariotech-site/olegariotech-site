name: Finalize GA4 consent review

on:
  push:
    branches:
      - feat/ga4-consent-events
    paths:
      - .github/workflows/finalize-ga4-consent.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ga4-consent-events
      - name: Apply final review fixes
        shell: python
        run: |
          from pathlib import Path

          js = Path('assets/js/ot-analytics.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace(' role="dialog" aria-modal="true" aria-labelledby=', ' role="dialog" aria-labelledby=', 1)
          js.write_text(text, encoding='utf-8')

          privacy = Path('privacidade/index.html')
          text = privacy.read_text(encoding='utf-8').replace('28 de julho de 2026', '27 de julho de 2026')
          privacy.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          text = sitemap.read_text(encoding='utf-8').replace('<loc>https://olegariotech.com.br/privacidade/</loc>\n    <lastmod>2026-07-28</lastmod>', '<loc>https://olegariotech.com.br/privacidade/</loc>\n    <lastmod>2026-07-27</lastmod>')
          sitemap.write_text(text, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check assets/js/ot-analytics.js
      - name: Commit final review
        run: |
          git config user.name "Olegario Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/ot-analytics.js privacidade/index.html sitemap.xml
          git commit -m "fix: ajustar acessibilidade e data da política" || exit 0
          git push origin HEAD:feat/ga4-consent-events
