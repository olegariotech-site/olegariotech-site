name: PR64 Earth motion visual check
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/css/ot-earth-journey.css'
      - 'assets/js/ot-earth-journey.js'
      - 'assets/js/ot-earth-spin.js'
      - '.github/workflows/pr64-earth-motion-check.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ot-preview.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/ot-preview.log
          exit 1
      - name: Verify complete sphere and visible rotation
        run: |
          cat > capture-motion.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
          const sizes=[['desktop',1920,1080],['notebook',1366,768],['tablet',1024,768],['iphone',390,844],['android',412,915]];
          fs.mkdirSync('earth-motion',{recursive:true});
          const results=[];
          for(const [name,width,height] of sizes){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
            await page.addStyleTag({content:'#otConsent,.ot-consent-backdrop{display:none!important}'});
            if(width>900)await page.locator('#earthJourney.is-spinning').waitFor({timeout:15000});
            const globe=await page.evaluate(()=>{const e=document.getElementById('earthJourney'),r=e.getBoundingClientRect();return {left:r.left,right:r.right,visible:getComputedStyle(e).display!=='none',spinning:e.classList.contains('is-spinning')}});
            await page.screenshot({path:`earth-motion/${name}-start.png`});
            let changed=null;
            if(width>900){
              const canvas=page.locator('.earth-journey__canvas');
              const before=await canvas.screenshot();
              await page.waitForTimeout(3500);
              const after=await canvas.screenshot();
              changed=!before.equals(after);
              await page.screenshot({path:`earth-motion/${name}-after-3s.png`});
              if(globe.left < -2 || globe.right > width+2 || !changed)throw Error(`Sphere clipped or static: ${name}, ${JSON.stringify({globe,changed})}`);
            }else if(globe.visible||globe.spinning)throw Error(`Mobile Earth should remain static: ${name}`);
            if(errors.length)throw Error(`${name}: ${errors.join('; ')}`);
            results.push({name,globe,changed,errors});
            await page.close();
          }
          const reduced=await browser.newPage({viewport:{width:1366,height:768},reducedMotion:'reduce'});
          await reduced.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
          const reducedSpin=await reduced.evaluate(()=>document.getElementById('earthJourney').classList.contains('is-spinning'));
          await reduced.screenshot({path:'earth-motion/reduced-hero.png'});
          if(reducedSpin)throw Error('Reduced motion still spins');
          fs.writeFileSync('earth-motion/results.json',JSON.stringify({results,reducedSpin},null,2));
          await browser.close();
          JS
          node capture-motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr64-earth-motion
          path: earth-motion/*
          retention-days: 7
