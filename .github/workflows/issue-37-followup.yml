name: Issue 37 final validation

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final cleanup
        run: python3 .github/scripts/issue37_followup.py
      - name: Static validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          text=Path('preview/ot-commercial-navigation.html').read_text(encoding='utf-8')
          assert '</a></header></div></header>' not in text
          assert text.count('<header class="mobile-header">') == 1
          assert '<div class="mobile-actions">' in text
          assert 'class="rail-wa"' not in text
          assert '.rail-wa{' not in text
          assert '/assets/audio/background.mp3' in text
          assert 'id="waFab"' in text
          assert 'noindex,nofollow' in text
          assert 'G-0YXCH58MXD' not in text
          ids=re.findall(r'\bid="([^"]+)"',text)
          dupes={item for item in ids if ids.count(item)>1}
          assert not dupes,dupes
          class Parser(HTMLParser): pass
          Parser().feed(text)
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          Path('/tmp/preview-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/preview-inline.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Browser validation
        run: |
          python3 -m http.server 4173 >/tmp/ot-server.log 2>&1 &
          node <<'JS'
          const {chromium,webkit}=require('playwright');
          const url='http://127.0.0.1:4173/preview/ot-commercial-navigation.html';
          async function validate(engine,viewport,mobile=false){
            const browser=await engine.launch({headless:true});
            const page=await browser.newPage({viewportSize:viewport,isMobile:mobile});
            await page.addInitScript(()=>{
              Object.defineProperty(HTMLMediaElement.prototype,'paused',{configurable:true,get(){return this.__otPaused!==false}});
              HTMLMediaElement.prototype.play=function(){this.__otPaused=false;return Promise.resolve()};
              HTMLMediaElement.prototype.pause=function(){this.__otPaused=true};
            });
            const errors=[];
            page.on('console',message=>{if(message.type()==='error')errors.push(message.text())});
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto(url,{waitUntil:'networkidle'});
            const audio=page.locator('#backgroundAudio');
            if(await audio.evaluate(node=>!node.paused))throw new Error('audio autoplayed');
            const toggle=page.locator('.audio-toggle:visible');
            await toggle.dispatchEvent('click');
            if(await audio.evaluate(node=>node.paused))throw new Error('audio did not start');
            await toggle.dispatchEvent('click');
            if(!(await audio.evaluate(node=>node.paused)))throw new Error('audio did not pause');
            if(mobile){
              if(await page.locator('#waFab').isVisible())throw new Error('desktop WhatsApp visible on mobile');
              if(await page.locator('.mobile-actions').count()!==1)throw new Error('invalid mobile header actions');
            }else{
              if(await page.locator('#waFab').isVisible())throw new Error('WhatsApp visible while hero is visible');
              await page.locator('#projetos').scrollIntoViewIfNeeded();
              await page.waitForTimeout(350);
              if(!(await page.locator('#waFab').isVisible()))throw new Error('WhatsApp hidden after hero');
              await page.locator('#waFab').focus();
            }
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
            if(overflow||errors.length)throw new Error(JSON.stringify({overflow,errors}));
            await browser.close();
          }
          (async()=>{
            for(const viewport of [{width:1366,height:600},{width:1366,height:640}])await validate(chromium,viewport,false);
            for(const engine of [chromium,webkit])for(const viewport of [{width:390,height:844},{width:430,height:932}])await validate(engine,viewport,true);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Commit final preview and remove temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preview/ot-commercial-navigation.html
          git rm -f .github/workflows/issue-37-followup.yml .github/scripts/issue37_followup.py
          git commit -m "fix: corrigir cabeçalho móvel e limpar CTA lateral [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
