name: Fix hero first fold

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/hero-primeira-dobra'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/hero-primeira-dobra
          fetch-depth: 0

      - name: Apply hero fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_words = "const words=['crescer e vender melhor.','chamar no WhatsApp.','parecer profissional.','virar referência.'];"
          new_words = "const words=['crescer e vender melhor.','chamar no WhatsApp.','transmitir confiança.','virar referência.'];"
          if old_words in text:
              text = text.replace(old_words, new_words, 1)
          elif new_words not in text:
              raise SystemExit("Dynamic hero words pattern not found")

          css_marker = """    /* HERO FIRST FOLD FIX — Olegario Tech 2026-07 */
              .hero-progress{display:none!important}
              @media(min-width:901px){
                .hero-sticky{padding:94px 0 26px}
                .hero-grid{min-height:0}
                .hero-content{width:min(53%,640px)}
                .earth-orbit{right:2.5vw;top:50%;width:min(39vw,500px)}
                .shint{bottom:12px;opacity:.64}
              }
              @media(min-width:901px) and (max-height:840px){
                .hero-sticky{padding:84px 0 18px}
                .hbadge{min-height:30px;padding:0 13px;margin-bottom:13px;font-size:.7rem}
                .htitle.hero-title-modern{margin-bottom:11px}
                .hero-title-main{font-size:clamp(2.85rem,4.95vw,4.25rem);line-height:.9}
                .hero-title-sub{font-size:clamp(1.08rem,1.65vw,1.42rem);margin:9px 0 2px}
                .htitle .hero-title-word{font-size:clamp(2.12rem,3.55vw,3.25rem);line-height:.92}
                .hsub{font-size:.96rem;line-height:1.5;margin-bottom:12px;max-width:610px}
                .hero-chips{gap:7px;margin-bottom:14px}
                .hero-chip{min-height:28px;padding:0 9px;font-size:.61rem}
                .hero-chip:nth-child(4){display:none}
                .hact{gap:8px;margin-bottom:13px;flex-wrap:nowrap}
                .hact .btn{min-height:43px;padding:0 15px;font-size:.78rem;white-space:nowrap}
                .hero-link{min-height:43px;padding:0 3px;font-size:.78rem;white-space:nowrap}
                .cta-assurance{margin:-4px 0 0;font-size:.62rem}
                .earth-orbit{right:3vw;top:50%;width:min(35vw,455px)}
                .shint{display:none}
              }
          """
          if "HERO FIRST FOLD FIX" not in text:
              close_style = "\n  </style>"
              if close_style not in text:
                  raise SystemExit("Closing style tag not found")
              text = text.replace(close_style, "\n" + css_marker + close_style, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "Hero already fixed."
            exit 0
          fi
          git config user.name "Olegario Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: compactar hero e melhorar primeira dobra"
          git push origin HEAD:fix/hero-primeira-dobra
