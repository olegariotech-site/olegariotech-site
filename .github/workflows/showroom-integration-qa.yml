name: Gate B integrated showroom QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/css/ot-*.css'
      - 'assets/js/ot-*.js'
      - 'assets/js/ot-*.mjs'
      - 'assets/img/projetos/showroom-v2/**'
      - 'scripts/build-showroom.mjs'
      - 'scripts/verify-showroom.mjs'
      - 'scripts/verify-atmosphere.mjs'
      - 'scripts/measure-atmosphere.mjs'
      - 'scripts/measure-continuum.mjs'
      - 'scripts/verify-continuum.mjs'
      - '.github/workflows/showroom-integration-qa.yml'
permissions:
  contents: read
jobs:
  complete-home:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Validate canonical HTML and module syntax
        run: |
          node --check assets/js/ot-project-showroom.mjs
          node --check scripts/verify-showroom.mjs
          node --check assets/js/ot-cosmic-scene.js
          node --check scripts/verify-atmosphere.mjs
          node --check scripts/measure-atmosphere.mjs
          node --check scripts/measure-continuum.mjs
          node --check scripts/verify-continuum.mjs
          node scripts/build-showroom.mjs --check
      - name: Verify the complete home in Chromium and WebKit
        env:
          OT_QA_OUTPUT: /tmp/ot-gate-b-qa
          OT_QA_ENGINES: ${{ matrix.engine }}
        run: node scripts/verify-showroom.mjs
      - name: Verify continuous atmosphere and motion preferences
        env:
          OT_ATMOSPHERE_OUTPUT: /tmp/ot-gate-b-qa/atmosphere
          OT_QA_ENGINES: ${{ matrix.engine }}
        run: node scripts/verify-atmosphere.mjs
      - name: Verify the Cosmic Continuum journey and direct anchors
        env:
          OT_CONTINUUM_OUTPUT: /tmp/ot-gate-b-qa/continuum
          OT_QA_ENGINES: ${{ matrix.engine }}
        run: node scripts/verify-continuum.mjs
      - name: Upload home comparisons and regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ot-premium-v2-gate-b-${{ matrix.engine }}-review
          path: /tmp/ot-gate-b-qa
          retention-days: 30

  continuum-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        renderer: [webgl, canvas2d]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for equivalent complete-home measurements
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Five cold samples in each version, viewport and motion condition
        env:
          OT_CONTINUUM_RENDERER: ${{ matrix.renderer }}
          OT_CONTINUUM_OUTPUT: /tmp/ot-continuum-performance
        run: node scripts/measure-continuum.mjs
      - name: Upload individual samples and layout shift attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ot-v22-performance-${{ matrix.renderer }}
          path: /tmp/ot-continuum-performance
          retention-days: 30
