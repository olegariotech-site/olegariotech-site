name: Apply GA4 consent integration

on:
  push:
    branches:
      - feat/ga4-consent-events
    paths:
      - .github/workflows/apply-ga4-consent.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ga4-consent-events

      - name: Patch production pages and sitemap
        shell: python
        run: |
          from pathlib import Path

          analytics_head = '''  <link rel="stylesheet" href="/assets/css/ot-consent.css?v=1">
            <script>
              window.OT_GA_ID='G-0YXCH58MXD';
              window.dataLayer=window.dataLayer||[];
              window.gtag=window.gtag||function(){dataLayer.push(arguments)};
              gtag('consent','default',{
                analytics_storage:'denied',
                ad_storage:'denied',
                ad_user_data:'denied',
                ad_personalization:'denied',
                wait_for_update:500
              });
            </script>
            <script src="/assets/js/ot-analytics.js?v=1" defer></script>
          '''

          def patch_once(path, marker, replacement, guard):
              text = path.read_text(encoding='utf-8')
              if guard in text:
                  return False
              if marker not in text:
                  raise SystemExit(f'Marker not found in {path}: {marker[:60]}')
              path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
              return True

          home = Path('index.html')
          patch_once(
              home,
              "  <script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>",
              analytics_head + "  <script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>",
              'ot-analytics.js?v=1'
          )
          home_text = home.read_text(encoding='utf-8')
          if '<a href="/privacidade/">Privacidade</a>' not in home_text:
              marker = '          <a href="#faq">FAQ</a>\n'
              if marker not in home_text:
                  raise SystemExit('Home footer marker not found')
              home_text = home_text.replace(marker, marker + '          <a href="/privacidade/">Privacidade</a>\n', 1)
              home.write_text(home_text, encoding='utf-8')

          diagnostic = Path('diagnostico-digital/index.html')
          patch_once(
              diagnostic,
              '  <style>\n',
              analytics_head + '  <style>\n',
              'ot-analytics.js?v=1'
          )
          diagnostic_text = diagnostic.read_text(encoding='utf-8')
          if '<a href="/privacidade/">Privacidade</a>' not in diagnostic_text:
              marker = '      <span>Sites, landing pages e WhatsApp comercial.</span>\n'
              if marker not in diagnostic_text:
                  raise SystemExit('Diagnostic footer marker not found')
              diagnostic_text = diagnostic_text.replace(marker, marker + '      <a href="/privacidade/">Privacidade</a>\n', 1)
              diagnostic.write_text(diagnostic_text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sitemap_text = sitemap.read_text(encoding='utf-8')
          if 'https://olegariotech.com.br/privacidade/' not in sitemap_text:
              entry = '''  <url>
              <loc>https://olegariotech.com.br/privacidade/</loc>
              <lastmod>2026-07-28</lastmod>
              <changefreq>yearly</changefreq>
              <priority>0.3</priority>
            </url>
          '''
              sitemap_text = sitemap_text.replace('</urlset>', entry + '</urlset>', 1)
              sitemap.write_text(sitemap_text, encoding='utf-8')

      - name: Validate files
        run: |
          node --check assets/js/ot-analytics.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          for filename in ['index.html', 'diagnostico-digital/index.html', 'privacidade/index.html']:
              Parser().feed(Path(filename).read_text(encoding='utf-8'))
              print('HTML parsed:', filename)
          PY

      - name: Commit integration
        run: |
          git config user.name "Olegario Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html diagnostico-digital/index.html sitemap.xml
          git commit -m "feat: instalar GA4 com consentimento e eventos" || exit 0
          git push origin HEAD:feat/ga4-consent-events
