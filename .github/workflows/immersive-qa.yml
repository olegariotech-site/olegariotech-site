name: Immersive home QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/css/ot-*.css'
      - 'assets/js/ot-*.js'
      - 'scripts/verify-immersive.mjs'
      - 'scripts/verify-solutions.mjs'
      - '.github/workflows/immersive-qa.yml'
permissions:
  contents: read
jobs:
  visual-and-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Validate JavaScript
        run: |
          for file in assets/js/ot-earth-journey.js assets/js/ot-earth-spin.js assets/js/ot-digital-pulse.js assets/js/ot-solution-configurator.js assets/js/ot-surface-motion.js; do node --check "$file"; done
      - name: Verify motion, controls and responsive layout
        env:
          OT_QA_OUTPUT: /tmp/ot-immersive-qa
          OT_QA_FOCUS: projects
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ot-preview.log 2>&1 &
          node scripts/verify-immersive.mjs
          node scripts/verify-solutions.mjs
      - name: Upload review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ot-immersive-review
          path: /tmp/ot-immersive-qa
          retention-days: 14
