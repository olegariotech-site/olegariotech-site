name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/ot-premium-v21-atmosphere]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: /tmp/ot-codeql-137

      - name: Verify actual SARIF finding counts for the four reviewed alerts
        run: node scripts/verify-codeql-137.mjs /tmp/ot-codeql-137

      - name: Preserve SARIF and per-rule counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ot-codeql-137-results
          path: /tmp/ot-codeql-137
          retention-days: 30
