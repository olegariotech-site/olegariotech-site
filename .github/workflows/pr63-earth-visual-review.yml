name: PR63 Earth journey visual review

on:
  workflow_dispatch:
  push:
    branches:
      - planet-scroll-journey-20260928
    paths:
      - 'index.html'
      - 'assets/css/ot-earth-journey.css'
      - 'assets/js/ot-earth-journey.js'
      - 'assets/img/orbit/**'
      - '.github/workflows/pr63-earth-visual-review.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ot-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ot-server.log
          exit 1
      - name: Capture Earth journey
        run: |
          cat > capture-earth.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const configs=[
            ['desktop-1920x1080',1920,1080],
            ['notebook-1366x768',1366,768],
            ['tablet-1024x768',1024,768],
            ['iphone-390x844',390,844],
            ['android-412x915',412,915],
          ];
          fs.mkdirSync('earth-review',{recursive:true});
          const browser=await chromium.launch({headless:true});

          async function dismiss(page){
            await page.addStyleTag({content:'#otConsent{display:none!important}.ot-consent-backdrop{display:none!important}'});
          }
          async function snap(page,vp,label){
            await page.waitForTimeout(450);
            const state=await page.evaluate(()=>{
              const e=document.getElementById('earthJourney');
              const globe=e?.querySelector('.earth-journey__globe');
              const heroPlanet=document.querySelector('.hero .planet-wrap');
              const es=e?getComputedStyle(e):null;
              const gs=globe?getComputedStyle(globe):null;
              const hs=heroPlanet?getComputedStyle(heroPlanet):null;
              return {
                y:Math.round(scrollY),
                earthDisplay:es?.display,
                earthOpacity:es?.opacity,
                earthTransform:es?.transform,
                globeTransform:gs?.transform,
                heroPlanetDisplay:hs?.display,
                heroPlanetOpacity:hs?.opacity
              };
            });
            console.log(JSON.stringify({viewport:vp,state:label,...state}));
            await page.screenshot({path:'earth-review/'+vp+'__'+label+'.png',fullPage:false});
          }
          async function scrollSection(page,id,anchor=.16){
            await page.evaluate(({id,anchor})=>{
              const el=document.getElementById(id);
              scrollTo(0,Math.max(0,el.offsetTop-innerHeight*anchor));
            },{id,anchor});
          }

          for(const [vp,w,h] of configs){
            const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
            await dismiss(page);

            await page.evaluate(()=>scrollTo(0,0));
            await snap(page,vp,'01-hero');

            if(w>900){
              await page.evaluate(()=>scrollTo(0,document.getElementById('inicio').offsetHeight*.48));
              await snap(page,vp,'02-hero-scroll');

              await scrollSection(page,'projetos');
              await snap(page,vp,'03-projects-hidden');

              await scrollSection(page,'produtos');
              await snap(page,vp,'04-products-hidden');

              await scrollSection(page,'faq');
              await snap(page,vp,'05-faq-hidden');

              await scrollSection(page,'contato',.22);
              await snap(page,vp,'06-cta-return');
            }else{
              await scrollSection(page,'projetos');
              await snap(page,vp,'02-projects-mobile');

              await scrollSection(page,'contato',.16);
              await snap(page,vp,'03-cta-mobile');
            }
            await page.close();
          }

          const reduced=await browser.newPage({viewport:{width:1366,height:768},deviceScaleFactor:1});
          await reduced.emulateMedia({reducedMotion:'reduce'});
          await reduced.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
          await dismiss(reduced);
          await snap(reduced,'reduced-1366x768','01-hero');
          await scrollSection(reduced,'projetos');
          await snap(reduced,'reduced-1366x768','02-projects');
          await reduced.close();

          await browser.close();
          JS
          node capture-earth.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pr63-earth-visual-review
          path: earth-review/*.png
          if-no-files-found: error
          retention-days: 7
