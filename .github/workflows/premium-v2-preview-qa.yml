name: Premium V2 isolated preview QA
on:
  pull_request:
    paths:
      - 'docs/prototypes/ot-premium-v2-showroom/**'
      - '.github/workflows/premium-v2-preview-qa.yml'
permissions:
  contents: read
jobs:
  isolated-showroom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Check canonical content and syntax
        run: |
          node docs/prototypes/ot-premium-v2-showroom/build.mjs --check
          node docs/prototypes/ot-premium-v2-showroom/bundle.mjs
          for file in docs/prototypes/ot-premium-v2-showroom/*.mjs; do node --check "$file"; done
      - name: Verify isolated preview in Chromium and WebKit
        env:
          OT_QA_OUTPUT: /tmp/ot-premium-v2-qa
          OT_QA_ENGINES: chromium,webkit
        run: |
          node docs/prototypes/ot-premium-v2-showroom/verify.mjs
          cp docs/prototypes/ot-premium-v2-showroom/preview-offline.html /tmp/ot-premium-v2-qa/OT_PREMIUM_V2_PREVIA.html
      - name: Upload captures and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ot-premium-v2-review
          path: /tmp/ot-premium-v2-qa
          retention-days: 30
