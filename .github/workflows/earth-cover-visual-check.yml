name: Earth and portfolio visual check
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/css/ot-project-cases.css'
      - 'assets/css/ot-earth-journey.css'
      - 'assets/js/ot-earth-journey.js'
      - 'assets/js/ot-earth-spin.js'
      - 'assets/js/vendor/**'
      - 'assets/img/orbit/**'
      - '.github/workflows/earth-cover-visual-check.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ot-preview.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/ot-preview.log
          exit 1
      - name: Verify globe and covers
        run: |
          cat > capture-visual.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
          const sizes=[['desktop',1920,1080],['notebook',1366,768],['tablet',1024,768],['iphone',390,844],['android',412,915]];
          fs.mkdirSync('visual-check',{recursive:true});
          const results=[];
          for(const [name,width,height] of sizes){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
            await page.addStyleTag({content:'#otConsent,.ot-consent-backdrop{display:none!important}'});
            if(width>900)await page.locator('#earthJourney.is-spinning').waitFor({timeout:15000});
            await page.screenshot({path:`visual-check/${name}-hero.png`});
            const hero=await page.evaluate(()=>({spin:document.getElementById('earthJourney').classList.contains('is-spinning'),fixed:getComputedStyle(document.getElementById('earthJourney')).display,static:getComputedStyle(document.querySelector('.hero .planet-wrap')).display}));
            await page.locator('[data-project="acai"]').click();
            await page.locator('#projectStage').scrollIntoViewIfNeeded();
            await page.waitForTimeout(600);
            await page.locator('#projectStage').screenshot({path:`visual-check/${name}-acai.png`});
            const acai=await page.evaluate(()=>{const img=document.querySelector('#projectStage .project-image>img');return {fit:getComputedStyle(img).objectFit,loaded:img.naturalWidth>0,ratio:img.naturalWidth/img.naturalHeight}});
            await page.locator('[data-project="kl"]').click();
            await page.waitForTimeout(600);
            await page.locator('#projectStage').screenshot({path:`visual-check/${name}-kl.png`});
            results.push({name,hero,acai,errors});
            if(!acai.loaded||acai.fit!=='contain'||errors.length)throw Error(JSON.stringify(results.at(-1)));
            if(width>900&&!hero.spin)throw Error(`Rotating globe unavailable at ${name}`);
            if(width<=900&&(hero.fixed!=='none'||hero.static==='none'))throw Error(`Mobile fallback invalid at ${name}`);
            await page.close();
          }
          const reduced=await browser.newPage({viewport:{width:1366,height:768},reducedMotion:'reduce'});
          await reduced.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
          const reducedSpin=await reduced.evaluate(()=>document.getElementById('earthJourney').classList.contains('is-spinning'));
          await reduced.screenshot({path:'visual-check/reduced-hero.png'});
          if(reducedSpin)throw Error('Reduced motion still spins');
          fs.writeFileSync('visual-check/results.json',JSON.stringify({results,reducedSpin},null,2));
          await browser.close();
          JS
          node capture-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-cover-visual-check
          path: visual-check/*
          retention-days: 7
