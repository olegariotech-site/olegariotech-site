name: Digital Pulse visual preview

on:
  push:
    branches:
      - feature/ot-digital-pulse-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install preview browser
        shell: bash
        run: |
          mkdir -p /tmp/ot-preview
          cd /tmp/ot-preview
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve branch
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ot-http.log 2>&1 &
          echo $! > /tmp/ot-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ot-http.log
          exit 1

      - name: Capture Digital Pulse states
        shell: bash
        run: |
          mkdir -p visual-artifacts
          cat > /tmp/ot-preview/capture.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']
            });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1200);
            const accept = page.getByRole('button', { name: 'Aceitar tudo' });
            if (await accept.count()) {
              await accept.click();
              await page.waitForTimeout(350);
            }

            const heroHeight = await page.locator('#inicio').evaluate(el => el.offsetHeight);
            const states = [
              ['00-hero-start', 0],
              ['01-pulse-enter', 0.12],
              ['02-pulse-strong', 0.26],
              ['03-pulse-spread', 0.36],
              ['04-pulse-return', 0.52]
            ];

            const diagnostics = [];
            for (const [name, ratio] of states) {
              await page.evaluate(y => window.scrollTo(0, y), Math.round(heroHeight * ratio));
              await page.waitForTimeout(650);
              const state = await page.evaluate(() => {
                const earth = document.getElementById('earthJourney');
                const canvas = earth?.querySelector('canvas');
                return {
                  scrollY: window.scrollY,
                  pulse: earth?.dataset.pulse || null,
                  spread: earth?.dataset.spread || null,
                  animate: earth?.dataset.animate || null,
                  digitalPulseClass: document.documentElement.classList.contains('has-digital-pulse'),
                  spinning: earth?.classList.contains('is-spinning') || false,
                  pulseClass: earth?.classList.contains('is-pulse') || false,
                  canvasOpacity: canvas ? getComputedStyle(canvas).opacity : null
                };
              });
              diagnostics.push({ name, ...state });
              await page.screenshot({
                path: `visual-artifacts/${name}-1440.png`,
                fullPage: false
              });
            }

            const mobile = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1
            });
            await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await mobile.waitForTimeout(800);
            const mobileAccept = mobile.getByRole('button', { name: 'Aceitar tudo' });
            if (await mobileAccept.count()) {
              await mobileAccept.click();
              await mobile.waitForTimeout(250);
            }
            diagnostics.push({
              name: 'mobile-fallback',
              ...(await mobile.evaluate(() => {
                const earth = document.getElementById('earthJourney');
                return {
                  display: earth ? getComputedStyle(earth).display : null,
                  pulse: earth?.dataset.pulse || null,
                  animate: earth?.dataset.animate || null
                };
              }))
            });
            await mobile.screenshot({
              path: 'visual-artifacts/05-mobile-fallback-390.png',
              fullPage: false
            });

            fs.writeFileSync('visual-artifacts/diagnostics.json', JSON.stringify(diagnostics, null, 2));
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
          node /tmp/ot-preview/capture.cjs

      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: digital-pulse-visual-preview
          path: visual-artifacts/
          retention-days: 7
