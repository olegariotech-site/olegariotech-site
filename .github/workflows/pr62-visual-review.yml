name: PR62 visual review

on:
  workflow_dispatch:
  push:
    branches:
      - refine-portfolio-case-covers-20260928
    paths:
      - 'index.html'
      - 'assets/css/ot-project-cases.css'
      - 'assets/img/projetos/**'
      - '.github/workflows/pr62-visual-review.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ot-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ot-server.log
          exit 1

      - name: Capture project cases
        run: |
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const viewports = [
            ['desktop-1920x1080', 1920, 1080],
            ['notebook-1366x768', 1366, 768],
            ['tablet-1024x768', 1024, 768],
            ['iphone-390x844', 390, 844],
            ['android-412x915', 412, 915],
          ];
          const cases = [
            ['acai', 'Açaí do Dudu'],
            ['kl', 'K.L Transporte'],
            ['adega', 'Adega'],
            ['advocacia', 'Cíntia'],
            ['navalha', 'Barbearia'],
            ['mercado', 'Mercado'],
          ];

          fs.mkdirSync('visual-review', { recursive: true });
          const browser = await chromium.launch({ headless: true });

          for (const [vpName, width, height] of viewports) {
            const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.emulateMedia({ reducedMotion: 'no-preference' });
            await page.locator('#projetos').scrollIntoViewIfNeeded();
            await page.waitForTimeout(500);

            for (const [key, label] of cases) {
              const tab = page.locator('[data-project="' + key + '"]');
              await tab.click();
              await page.waitForTimeout(850);
              const stage = page.locator('#projectStage');
              await stage.scrollIntoViewIfNeeded();
              await page.waitForTimeout(250);
              await stage.screenshot({ path: 'visual-review/' + vpName + '__' + key + '.png' });
              const box = await stage.boundingBox();
              console.log(JSON.stringify({ viewport: vpName, case: label, box }));
            }
            await page.close();
          }

          await browser.close();
          JS
          node capture.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pr62-visual-review
          path: visual-review/*.png
          if-no-files-found: error
          retention-days: 7
