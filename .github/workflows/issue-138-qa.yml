name: OT Issue 138 targeted measurement
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/ot-analytics*.js'
      - 'assets/js/ot-google-measurement.js'
      - 'assets/js/ot-commercial-context.js'
      - 'assets/ot-google-measurement.html'
      - 'scripts/*138*'
      - 'docs/reviews/issue-138/**'
      - '.github/workflows/issue-138-qa.yml'
permissions:
  contents: read
jobs:
  measurement:
    name: Issue 138 (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact scoped delta and causal offline controls
        run: |
          node scripts/verify-issue-138-scope.mjs
          node scripts/verify-issue-138.mjs
          node scripts/verify-consent-timeline-137.mjs
          node scripts/verify-ads-whatsapp-origin.mjs
      - name: Install test dependencies only
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Targeted real SDK and navigation; all collectors intercepted
        env:
          OT_134_ENGINE: ${{ matrix.engine }}
          OT_138_OUTPUT: /tmp/ot-issue-138
        run: node scripts/verify-issue-138.mjs --browser
      - name: Preserve complete consent and cross-tab contracts
        if: ${{ !cancelled() }}
        env:
          OT_134_ENGINE: ${{ matrix.engine }}
          OT_134_OUTPUT: /tmp/ot-issue-138/legacy
        run: node scripts/verify-ga4-consent-137.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ot-issue-138-${{ matrix.engine }}
          path: /tmp/ot-issue-138
          retention-days: 30
