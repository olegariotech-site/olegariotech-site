<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050008">
  <title>Carregando Terra Orbit | Olegario Tech</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#050008;color:#eef0ff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}.loader{width:min(560px,100%);padding:32px;border:1px solid rgba(103,232,249,.18);border-radius:24px;background:rgba(9,7,26,.82);box-shadow:0 30px 90px rgba(0,0,0,.62)}.orb{width:74px;aspect-ratio:1;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1e80a7,#071427 62%,#02050a);border:1px solid rgba(103,232,249,.45);box-shadow:inset -18px -12px 34px rgba(0,0,0,.75),0 0 38px rgba(103,232,249,.2);position:relative;animation:spin 5s linear infinite}.orb::after{content:'';position:absolute;inset:28px -24px;border:1px solid rgba(168,85,247,.48);border-radius:50%;transform:rotate(-16deg)}h1{font-size:1.35rem;margin:0 0 10px}p{margin:0;color:#a4abc4;line-height:1.65}.error{display:none;margin-top:18px;padding:14px;border-radius:14px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.24);color:#ffd48a}a{color:#67e8f9}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
  </style>
</head>
<body>
  <main class="loader">
    <div class="orb" aria-hidden="true"></div>
    <h1>Preparando a Terra Orbit</h1>
    <p>Preview isolado da nova experiência visual. A home oficial continua intacta.</p>
    <div class="error" id="error">Não foi possível carregar a branch. Confira o <a href="https://github.com/olegariotech-site/olegariotech-site/pull/18">PR #18</a>.</div>
  </main>
  <script>
    (async function(){
      const root='https://raw.githubusercontent.com/olegariotech-site/olegariotech-site/feature/orbit-earth-synapse-preview/';
      try{
        const response=await fetch(root+'index.html?ts='+Date.now(),{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        let html=await response.text();
        html=html.replace('<head>','<head><base href="'+root+'">');
        html=html.replace('<meta name="robots" content="index,follow,max-image-preview:large">','<meta name="robots" content="noindex,nofollow">');
        html=html.replace('<link rel="canonical" href="https://olegariotech.com.br/">','<link rel="canonical" href="https://olegariotech.com.br/preview/orbit-earth-synapse.html">');
        document.open();document.write(html);document.close();
      }catch(error){console.error('[Orbit Earth preview]',error);document.getElementById('error').style.display='block'}
    })();
  </script>
</body>
</html>
